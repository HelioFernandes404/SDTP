# Lint de Conventional Commits no PR: a versão é calculada a partir das mensagens,
# então mensagem fora do padrão bloqueia o merge (check obrigatório na develop).
# O repo só permite "Create a merge commit": squash trocaria os commits checados por um commit
# com o título do PR, e rebase reescreveria os SHAs. O título também é checado.
name: commits

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, edited]   # edited: rechecar quando o título muda

permissions:
  contents: read

jobs:
  cog-check:
    name: cog check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # precisa do histórico para checar o intervalo do PR

      - name: Instalar cog (versão fixa, sha256 conferido)
        run: sudo scripts/install-cog.sh

      - name: Checar só os commits do PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: cog check "$BASE..$HEAD"

      - name: Checar o título do PR
        env:
          TITULO: ${{ github.event.pull_request.title }}   # via env: o título nunca vira código do shell
        # cog verify lê user.name e user.email do git (o runner não tem) e aborta sem eles.
        run: |
          git config --global user.name ci
          git config --global user.email ci@localhost
          cog verify "$TITULO"
